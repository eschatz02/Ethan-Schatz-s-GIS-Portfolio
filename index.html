<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIS Portfolio | Ethan Schatz</title>

  <!-- Link to external CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="pageHeader">
    <div class="header-content">
      <div class="site-title">
        <h1>Ethan Schatz GIS Portfolio</h1>
        <p>Cartography, spatial analysis, GIS projects</p>
      </div>

      <nav>
        <div class="tab-group">
          <button class="tab-button" onclick="toggleDropdown('byuDropdown', 'byu')">
            BYU Work ▾
          </button>
          <div class="dropdown" id="byuDropdown">
            <button onclick="showSection('byu-2022','byu')">2022</button>
            <button onclick="showSection('byu-2023','byu')">2023</button>
            <button onclick="showSection('byu-2024','byu')">2024</button>
          </div>
        </div>

        <div class="tab-group">
          <button class="tab-button" onclick="toggleDropdown('utahDropdown', 'utah')">
            University of Utah Work ▾
          </button>
          <div class="dropdown" id="utahDropdown">
            <button onclick="showSection('utah-2025','utah')">2025</button>
            <button onclick="showSection('utah-2026','utah')">2026</button>
            <button onclick="showSection('utah-capstone','utah')">Capstone</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" id="homeSection">
      <h2>GIS Portfolio</h2>
      <p>Select a category above to view your work.</p>
    </section>

    <section class="portfolio-section" id="byu-2022"><h2>BYU 2022</h2></section>
    <section class="portfolio-section" id="byu-2023"><h2>BYU 2023</h2></section>
    <section class="portfolio-section" id="byu-2024"><h2>BYU 2024</h2></section>

    <section class="portfolio-section" id="utah-2025"><h2>Utah 2025</h2></section>
    <section class="portfolio-section" id="utah-2026"><h2>Utah 2026</h2></section>
    <section class="portfolio-section" id="utah-capstone"><h2>Capstone</h2></section>
  </main>

  <script>
    const header = document.getElementById('pageHeader');
    const dropdowns = document.querySelectorAll('.dropdown');
    const sections = document.querySelectorAll('.portfolio-section');
    const home = document.getElementById('homeSection');

    function toggleDropdown(id, school){
      dropdowns.forEach(d => d.id !== id && d.classList.remove('show'));
      document.getElementById(id).classList.toggle('show');
      setTheme(school);
    }

    function showSection(id, school){
      home.style.display = 'none';
      sections.forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      setTheme(school);
    }

    function setTheme(school){
      header.classList.remove('byu','utah');
      if(school==='byu') header.classList.add('byu');
      if(school==='utah') header.classList.add('utah');
</html>
